<!-- Make whole cards clickable. Done in JS rather than with a stretched CSS
     overlay so that selecting the card's text still works, and so clicks that
     are really text selections are ignored. Without JS the title link behaves
     exactly as before. -->
<script>
  (function () {
    var cards = document.querySelectorAll('.list__item .archive__item');
    if (!cards.length) return;

    cards.forEach(function (card) {
      var title = card.querySelector('.archive__item-title');
      var primary = title && title.querySelector('a');
      if (!primary) return;

      card.classList.add('is-clickable');

      /* Remember where the press started so we can tell a click from a drag. */
      var downX = 0, downY = 0;
      card.addEventListener('mousedown', function (e) {
        downX = e.clientX;
        downY = e.clientY;
      });

      var activate = function (e) {
        /* Let real links/buttons handle their own clicks */
        if (e.target.closest('a, button, summary, input, textarea, select')) return;

        /* Ignore presses that were really drags, i.e. the user was selecting text. */
        if (Math.abs(e.clientX - downX) > 6 || Math.abs(e.clientY - downY) > 6) return;

        /* Ignore a click that lands on text the user has selected *in this card*. */
        /* Scoping to the card matters: a leftover selection elsewhere on the page */
        /* must not make every other card unclickable. */
        var sel = window.getSelection();
        if (sel && !sel.isCollapsed && sel.rangeCount) {
          var node = sel.getRangeAt(0).commonAncestorContainer;
          if (card === node || card.contains(node)) return;
        }

        var newTab = e.metaKey || e.ctrlKey || e.shiftKey || e.button === 1 ||
          primary.target === '_blank';
        if (newTab) {
          window.open(primary.href, '_blank', 'noopener');
        } else {
          window.location.href = primary.href;
        }
      };

      card.addEventListener('click', activate);
      /* Middle-click opens in a new tab, matching normal link behaviour */
      card.addEventListener('auxclick', function (e) {
        if (e.button === 1) { e.preventDefault(); activate(e); }
      });
    });
  })();
</script>

<!-- Copy-to-clipboard for BibTeX blocks (progressive enhancement: the <details>
     block and the raw text work fine without this) -->
<script>
  (function () {
    var buttons = document.querySelectorAll('[data-cite-copy]');
    if (!buttons.length) return;
    buttons.forEach(function (btn) {
      btn.addEventListener('click', function () {
        var body = btn.closest('.cite-block__body');
        var code = body && body.querySelector('code');
        if (!code) return;
        var text = code.innerText;
        var done = function (ok) {
          var original = btn.innerHTML;
          btn.innerHTML = ok
            ? '<i class="fas fa-check" aria-hidden="true"></i> Copied'
            : '<i class="fas fa-triangle-exclamation" aria-hidden="true"></i> Press Cmd/Ctrl+C';
          btn.classList.add('is-copied');
          setTimeout(function () {
            btn.innerHTML = original;
            btn.classList.remove('is-copied');
          }, 2000);
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(function () { done(true); }, function () { done(false); });
        } else {
          /* Fallback: select the text so the user can copy it manually */
          var range = document.createRange();
          range.selectNodeContents(code);
          var sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          done(false);
        }
      });
    });
  })();
</script>

<!-- Back-to-top button (injected via JS so it's absent without scripting) -->
<script>
  (function () {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'back-to-top';
    btn.setAttribute('aria-label', 'Back to top');
    btn.innerHTML = '<i class="fas fa-arrow-up" aria-hidden="true"></i>';
    btn.addEventListener('click', function () {
      var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      window.scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' });
    });
    document.body.appendChild(btn);
    var toggle = function () {
      if (window.scrollY > 400) { btn.classList.add('is-visible'); }
      else { btn.classList.remove('is-visible'); }
    };
    toggle();
    window.addEventListener('scroll', toggle, { passive: true });
  })();
</script>

<!-- Scroll-reveal for cards (progressive enhancement; respects reduced-motion) -->
<script>
  (function () {
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var els = document.querySelectorAll('.list__item .archive__item, .cv-item');
    if (reduce || !('IntersectionObserver' in window) || !els.length) return;
    els.forEach(function (el) { el.classList.add('reveal'); });
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (e.isIntersecting) { e.target.classList.add('is-visible'); io.unobserve(e.target); }
      });
    }, { threshold: 0.08, rootMargin: '0px 0px -40px 0px' });
    els.forEach(function (el) { io.observe(el); });
  })();
</script>
