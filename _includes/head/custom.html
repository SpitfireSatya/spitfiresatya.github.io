{% include base_path %}

<!-- start custom head snippets -->

<!-- Apply the stored/system colour scheme before first paint.
     The theme JS calls setTheme() with no argument on load, whose fallback is a
     boolean, so the OS preference was never applied on the initial render. -->
<script>
    (function () {
        try {
            var stored = localStorage.getItem('theme');
            var theme = (stored === 'dark' || stored === 'light')
                ? stored
                : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            if (theme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            } else {
                document.documentElement.removeAttribute('data-theme');
            }
        } catch (e) { /* private mode / storage disabled: fall back to light */ }
    })();
</script>

<!-- Web fonts: Inter (body) + Space Grotesk (headings) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
    rel="stylesheet">

<!-- Social/link-preview image (Open Graph + Twitter) -->
{% if site.og_image %}
<meta property="og:image" content="{{ site.og_image | prepend: '/images/' | prepend: site.url }}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="{{ site.og_image | prepend: '/images/' | prepend: site.url }}">
{% endif %}

<!-- Support for Academicons -->
<link rel="preload" href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css" as="style"
    onload="this.onload=null;this.rel='stylesheet'">
<noscript>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css">
</noscript>

<!-- Support for Font Awesome -->
<link rel="preload" href="{{ base_path }}/assets/css/fontawesome.css" as="style"
    onload="this.onload=null;this.rel='stylesheet'">
<noscript>
    <link rel="stylesheet" href="{{ base_path }}/assets/css/fontawesome.css">
</noscript>

<!-- favicon from https://commons.wikimedia.org/wiki/File:OOjs_UI_icon_academic-progressive.svg -->
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon-180x180.png" />
<link rel="icon" type="image/svg+xml" href="{{ base_path }}/images/favicon.svg" />
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-32x32.png" sizes="32x32" />
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-192x192.png" sizes="192x192" />
<link rel="manifest" href="{{ base_path }}/images/manifest.json" />
<link rel="icon" href="/images/favicon.ico" />
<meta name="theme-color" content="var(--global-bg-color)" />

<!-- end custom head snippets -->
