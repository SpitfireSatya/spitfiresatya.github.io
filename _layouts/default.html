---
layout: compress
---

{% include base_path %}

<!doctype html>
<html lang="{{ site.locale | slice: 0,2 }}" class="no-js"{% if site.site_theme == "dark" %} data-theme="dark"{% endif %}>
  <head>
    {% include head.html %}
    {% include head/custom.html %}
  </head>

  <body>

    {% include browser-upgrade.html %}
    {% include masthead.html %}

    <!-- Fixed sun/moon theme toggle, centred in the corner glow. Keeps the ids
         the theme script binds to (#theme-toggle / #theme-icon). -->
    <button id="theme-toggle" class="theme-orb" type="button" title="Toggle light and dark theme" aria-label="Toggle light and dark theme">
      <i id="theme-icon" class="fa-solid fa-sun" aria-hidden="true"></i>
    </button>

    {{ content }}

    <div class="page__footer">
      <footer>
        {% include footer/custom.html %}
        {% include footer.html %}
      </footer>
    </div>

    {% include scripts.html %}

  </body>
</html>
